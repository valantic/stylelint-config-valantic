name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  github_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v heading="## ${GITHUB_REF_NAME}" '$0 == heading { found = 1; next } /^## / && found { exit } found' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No entries found under '## ${GITHUB_REF_NAME}' in CHANGELOG.md." >&2
            exit 1
          fi

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
